# Non-secret settings. Secrets (API keys) go in .env, never here.

[app]
port = 8765
# LIVE trading needs BOTH this flag AND the LIVE toggle on the login screen.
allow_live = false

[risk]
risk_per_trade = 250          # $ lost if the stop is hit; position size = this / stop distance
daily_max_loss = 750          # realized + unrealized day P/L at or below -this locks new entries for the day
max_positions = 3             # open positions + working entries
max_open_risk = 750           # $ at stop across open positions + working entries
max_trades_per_day = 10       # filled entries
max_sector_exposure = 150000  # $ market value per industry (IBKR contract-details industry)
max_position_value = 100000   # $ cap per position, whatever the stop distance
default_target_r = 2.0        # take-profit default: fixed R multiple
atr_target_mult = 1.5         # ATR take-profit: entry +/- this x ATR(14) on 5-min bars
entry_cutoff_min = 30         # no new entries in the last N minutes of the session (15:30 on a normal day)
flatten_min = 10              # cancel everything and flatten N minutes before the close (15:50)
server_side_flatten = true    # also attach an IBKR-side market exit at flatten time to every bracket

[gateway]
ibc_path = 'C:\IBC'
tws_path = 'C:\Jts'
major_version = "1045"          # folder name under C:\Jts\ibgateway
command_port = 7462             # IBC command server (STOP etc.), bound to 127.0.0.1
client_id = 17
# API ports by mode. Gateway: 4002 paper / 4001 live. TWS: 7497 / 7496.
paper_port = 4002
live_port = 4001
